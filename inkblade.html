<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InkBlade — Writing RPG Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --night: #0e1525;
  --slate: #1c2640;
  --iron: #64748b;
  --amber: #e0a832;
  --ember: #ef6a44;
  --bone: #e8dfd4;
  --sage: #4ade80;
  --lilac: #a78bfa;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--night);
  color: var(--bone);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── BG ── */
.bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 50% 40% at 20% 30%, rgba(224,168,50,.04) 0%, transparent 70%),
    radial-gradient(ellipse 45% 55% at 80% 70%, rgba(167,139,250,.03) 0%, transparent 65%),
    linear-gradient(170deg, #0a1020 0%, #0e1525 50%, #111a2e 100%);
}
canvas#bgCanvas {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 1;
}

/* ── LAYOUT ── */
.wrap { position: relative; z-index: 10; max-width: 1020px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }

a.back {
  display: inline-flex; align-items: center; gap: .35rem;
  font-size: .75rem; font-weight: 700; letter-spacing: .06em;
  color: var(--iron); text-decoration: none; transition: color .2s;
  margin-bottom: 1rem;
}
a.back:hover { color: var(--amber); }

header { text-align: center; padding: 1rem 0 1.5rem; }
.title {
  font-family: 'Crimson Pro', serif;
  font-size: clamp(1.6rem, 4vw, 2.6rem);
  font-weight: 600; color: var(--bone);
  letter-spacing: .04em;
}
.title em { font-style: italic; color: var(--amber); }
.sub {
  font-size: .78rem; color: var(--iron);
  margin-top: .3rem; letter-spacing: .02em;
}
header::after {
  content: ''; display: block; width: 120px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  margin: 1.2rem auto 0; opacity: .4;
}

/* ── STATS BAR ── */
.stats-bar {
  display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
  background: rgba(28,38,64,.7); border: 1px solid rgba(100,116,139,.15);
  border-radius: 10px; padding: .7rem 1.2rem; margin-bottom: 1.2rem;
  backdrop-filter: blur(6px); font-size: .78rem;
}
.stat { display: flex; align-items: center; gap: .4rem; white-space: nowrap; }
.stat-label { color: var(--iron); font-weight: 600; }
.stat-val { color: var(--bone); font-weight: 700; }
.stat-val.amber { color: var(--amber); }
.stat-val.ember { color: var(--ember); }
.stat-val.lilac { color: var(--lilac); }
.xp-bar-wrap {
  width: 80px; height: 5px; background: rgba(255,255,255,.07);
  border-radius: 10px; overflow: hidden;
}
.xp-bar-fill {
  height: 100%; width: 0%; border-radius: 10px;
  background: linear-gradient(90deg, var(--lilac), #c4b5fd);
  transition: width .4s ease;
}

/* ── ARENA (editor + combat) ── */
.arena { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.2rem; align-items: start; }

/* ── EDITOR PANEL ── */
.editor-panel {
  background: rgba(28,38,64,.55); border: 1px solid rgba(100,116,139,.12);
  border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
}
.goal-wrap {
  padding: .75rem 1.2rem; display: flex; align-items: center; gap: .75rem;
  border-bottom: 1px solid rgba(100,116,139,.1);
}
.goal-label { font-size: .72rem; font-weight: 700; color: var(--iron); white-space: nowrap; }
.goal-bar {
  flex: 1; height: 6px; background: rgba(255,255,255,.06);
  border-radius: 10px; overflow: hidden;
}
.goal-fill {
  height: 100%; width: 0%; border-radius: 10px;
  background: linear-gradient(90deg, var(--sage), #86efac);
  transition: width .5s ease;
}
.goal-count { font-size: .7rem; color: var(--iron); white-space: nowrap; font-weight: 600; }
.goal-count.done { color: var(--sage); }

#editor {
  width: 100%; min-height: 320px; padding: 1.2rem 1.4rem;
  background: transparent; border: none; outline: none; resize: none;
  font-family: 'Crimson Pro', serif; font-size: 1.1rem; line-height: 1.85;
  color: var(--bone); caret-color: var(--amber);
}
#editor::placeholder { color: rgba(100,116,139,.5); font-style: italic; }

.editor-foot {
  padding: .6rem 1.2rem; display: flex; justify-content: space-between;
  border-top: 1px solid rgba(100,116,139,.1); font-size: .72rem; color: var(--iron);
}

/* ── COMBAT PANEL ── */
.combat-panel {
  background: rgba(28,38,64,.55); border: 1px solid rgba(100,116,139,.12);
  border-radius: 14px; padding: 1.2rem; display: flex; flex-direction: column; gap: 1rem;
}
.quest-tag {
  font-size: .65rem; font-weight: 700; letter-spacing: .1em;
  color: var(--amber); opacity: .7;
}
.quest-name {
  font-family: 'Crimson Pro', serif; font-size: 1.05rem;
  font-weight: 600; color: var(--bone); margin-top: .15rem;
}

.monster-area {
  display: flex; flex-direction: column; align-items: center;
  padding: 1rem 0; position: relative; min-height: 130px; justify-content: center;
}
.monster-sprite {
  font-size: 3.5rem; line-height: 1;
  animation: idle 3s ease-in-out infinite;
  transition: transform .15s ease, filter .15s ease;
}
@keyframes idle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.monster-sprite.hit {
  animation: shake .25s ease;
}
.monster-sprite.crit {
  animation: critShake .35s ease;
  filter: drop-shadow(0 0 12px var(--ember));
}
.monster-sprite.dying {
  animation: die .5s ease forwards;
}
@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px) rotate(-4deg); }
  50% { transform: translateX(6px) rotate(4deg); }
  75% { transform: translateX(-4px) rotate(-2deg); }
  100% { transform: translateX(0); }
}
@keyframes critShake {
  0% { transform: scale(1); }
  20% { transform: scale(1.2) rotate(-8deg); }
  40% { transform: scale(.85) rotate(6deg); }
  60% { transform: scale(1.1) rotate(-3deg); }
  100% { transform: scale(1); }
}
@keyframes die {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.15) rotate(10deg); opacity: .6; }
  100% { transform: scale(.3) rotate(25deg); opacity: 0; }
}

.damage-pop {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  font-weight: 700; font-size: 1.1rem; opacity: 0; pointer-events: none;
  color: var(--amber); text-shadow: 0 1px 6px rgba(224,168,50,.5);
}
.damage-pop.crit-pop {
  font-size: 1.4rem; color: var(--ember);
  text-shadow: 0 2px 10px rgba(239,106,68,.6);
}
.damage-pop.visible { animation: floatUp .9s ease-out forwards; }
@keyframes floatUp {
  0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  100% { opacity: 0; transform: translateX(-50%) translateY(-28px) scale(1.15); }
}

.hp-bar-wrap {
  width: 100%; height: 8px; background: rgba(255,255,255,.07);
  border-radius: 10px; overflow: hidden; margin-top: .75rem;
}
.hp-fill {
  height: 100%; width: 100%; border-radius: 10px;
  background: var(--sage); transition: width .3s ease, background .3s ease;
}
.hp-fill.wounded { background: var(--amber); }
.hp-fill.critical { background: var(--ember); }

.monster-label {
  display: flex; justify-content: space-between; align-items: baseline;
  width: 100%; margin-top: .4rem; font-size: .75rem;
}
.monster-name { font-weight: 700; color: var(--bone); }
.monster-hp { color: var(--iron); font-weight: 600; }
.monster-tier {
  font-size: .58rem; font-weight: 700; letter-spacing: .06em;
  padding: .12rem .5rem; border-radius: 20px; margin-left: .4rem;
}
.tier-minion { background: rgba(74,222,128,.12); color: var(--sage); }
.tier-mid { background: rgba(224,168,50,.12); color: var(--amber); }
.tier-boss { background: rgba(239,106,68,.12); color: var(--ember); }

.combat-log {
  font-size: .78rem; color: var(--iron); text-align: center;
  min-height: 1.4em; transition: color .2s;
}
.combat-log.active { color: var(--amber); }
.combat-log.crit-msg { color: var(--ember); font-weight: 700; }
.combat-log.kill-msg { color: var(--sage); font-weight: 700; }

.kill-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: .5rem;
  padding-top: .5rem; border-top: 1px solid rgba(100,116,139,.1);
}
.ks { font-size: .72rem; }
.ks-label { color: var(--iron); }
.ks-val { font-weight: 700; }

.mode-toggle {
  display: flex; align-items: center; justify-content: center;
  gap: .5rem; padding-top: .5rem;
}
.zen-btn {
  font-family: 'Nunito', sans-serif; font-size: .72rem; font-weight: 700;
  letter-spacing: .04em; padding: .45rem 1rem; border-radius: 8px;
  border: 1px solid rgba(100,116,139,.2); background: transparent;
  color: var(--iron); cursor: pointer; transition: all .2s;
}
.zen-btn:hover { border-color: var(--amber); color: var(--amber); }
.zen-btn.active { border-color: var(--amber); color: var(--night); background: var(--amber); }

/* ── REWARD TOAST ── */
.reward-toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
  background: rgba(28,38,64,.92); border: 1px solid rgba(224,168,50,.25);
  border-radius: 10px; padding: .7rem 1.4rem; font-size: .82rem;
  font-weight: 700; color: var(--amber); backdrop-filter: blur(8px);
  opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s;
  z-index: 100; white-space: nowrap;
  box-shadow: 0 8px 30px rgba(0,0,0,.4);
}
.reward-toast.visible {
  opacity: 1; transform: translateX(-50%) translateY(-6px);
}
.reward-toast.goal-toast { border-color: rgba(74,222,128,.3); color: var(--sage); }

/* ── ZEN MODE ── */
.arena.zen .combat-panel { display: none; }
.arena.zen { grid-template-columns: 1fr; max-width: 680px; margin: 0 auto; }

/* ── RESPONSIVE ── */
@media (max-width: 720px) {
  .arena { grid-template-columns: 1fr; }
  .stats-bar { gap: .75rem; }
  #editor { min-height: 220px; }
}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="bgCanvas"></canvas>

<div class="wrap">
  <a href="index.html" class="back">&#8592; Portfolio</a>

  <header>
    <div class="title">Ink<em>Blade</em></div>
    <div class="sub">Write words. Slay monsters. Keep the streak alive.</div>
  </header>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat">
      <span class="stat-label">Lv.</span>
      <span class="stat-val lilac" id="level">1</span>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xpBar"></div></div>
    </div>
    <div class="stat">
      <span class="stat-label">Runes</span>
      <span class="stat-val amber" id="runes">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Streak</span>
      <span class="stat-val ember" id="streak">0 days</span>
    </div>
    <div class="stat" style="margin-left:auto;">
      <span class="stat-label">Session</span>
      <span class="stat-val" id="totalWords">0 words</span>
    </div>
  </div>

  <!-- Arena -->
  <div class="arena" id="arena">

    <!-- Editor Panel -->
    <div class="editor-panel">
      <div class="goal-wrap">
        <span class="goal-label">Daily Goal</span>
        <div class="goal-bar"><div class="goal-fill" id="goalFill"></div></div>
        <span class="goal-count" id="goalCount">0 / 300</span>
      </div>
      <textarea id="editor" placeholder="Start writing here — every word is a weapon..."></textarea>
      <div class="editor-foot">
        <span id="saveStatus">Ready</span>
        <span id="sessionTime"></span>
      </div>
    </div>

    <!-- Combat Panel -->
    <div class="combat-panel" id="combatPanel">
      <div>
        <div class="quest-tag" id="questTag">QUEST 1 OF 5</div>
        <div class="quest-name" id="questName">The Dusty Shelf</div>
      </div>

      <div class="monster-area">
        <div class="monster-sprite" id="monsterSprite">🕷️</div>
        <div class="damage-pop" id="damagePop"></div>
        <div class="hp-bar-wrap"><div class="hp-fill" id="hpFill"></div></div>
        <div class="monster-label">
          <span>
            <span class="monster-name" id="monsterName">Ink Spider</span>
            <span class="monster-tier tier-minion" id="monsterTier">Minion</span>
          </span>
          <span class="monster-hp" id="monsterHp">40 / 40</span>
        </div>
      </div>

      <div class="combat-log" id="combatLog">Begin writing to attack...</div>

      <div class="kill-stats">
        <div class="ks"><span class="ks-label">Slain </span><span class="ks-val" id="slainCount">0</span></div>
        <div class="ks"><span class="ks-label">Relics </span><span class="ks-val amber" id="relicCount">0</span></div>
        <div class="ks"><span class="ks-label">Crits </span><span class="ks-val ember" id="critCount">0</span></div>
        <div class="ks"><span class="ks-label">Quest </span><span class="ks-val" id="questProgress">0 / 3</span></div>
      </div>

      <div class="mode-toggle">
        <button class="zen-btn" id="zenBtn" title="Hide combat and write in peace">Zen Mode</button>
      </div>
    </div>
  </div>
</div>

<div class="reward-toast" id="rewardToast"></div>

<script>
(() => {
  // ── PARTICLE BACKGROUND ──
  const cv = document.getElementById('bgCanvas');
  const cx = cv.getContext('2d');
  function resizeCanvas() { cv.width = cv.offsetWidth; cv.height = cv.offsetHeight; }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  const motes = Array.from({ length: 35 }, () => ({
    x: Math.random() * cv.width,
    y: Math.random() * cv.height,
    s: .8 + Math.random() * 2,
    vy: -(0.15 + Math.random() * .35),
    vx: (Math.random() - .5) * .2,
    o: 0,
    mo: .06 + Math.random() * .14,
    fi: true,
    w: Math.random() * Math.PI * 2,
    ws: .006 + Math.random() * .01,
    c: ['rgba(224,168,50,','rgba(167,139,250,','rgba(232,223,212,'][Math.floor(Math.random()*3)]
  }));

  function drawBg() {
    cx.clearRect(0, 0, cv.width, cv.height);
    for (const m of motes) {
      m.w += m.ws;
      m.x += m.vx + Math.sin(m.w) * .3;
      m.y += m.vy;
      if (m.fi) { m.o += .003; if (m.o >= m.mo) m.fi = false; }
      else if (m.y < cv.height * .25) m.o -= .002;
      if (m.y < -10 || m.o <= 0) {
        m.x = Math.random() * cv.width; m.y = cv.height + 10;
        m.o = 0; m.fi = true;
      }
      cx.beginPath(); cx.arc(m.x, m.y, m.s, 0, Math.PI * 2);
      cx.fillStyle = m.c + m.o + ')'; cx.fill();
      const g = cx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.s * 3);
      g.addColorStop(0, m.c + (m.o * .3) + ')');
      g.addColorStop(1, m.c + '0)');
      cx.beginPath(); cx.arc(m.x, m.y, m.s * 3, 0, Math.PI * 2);
      cx.fillStyle = g; cx.fill();
    }
    requestAnimationFrame(drawBg);
  }
  drawBg();

  // ── MONSTER DATA ──
  const bestiary = {
    minion: [
      { name: 'Ink Spider',    emoji: '🕷️', hp: 40 },
      { name: 'Page Moth',     emoji: '🦇', hp: 35 },
      { name: 'Draft Ghost',   emoji: '👻', hp: 45 },
      { name: 'Margin Rat',    emoji: '🐀', hp: 38 },
      { name: 'Plot Worm',     emoji: '🪱', hp: 42 },
    ],
    mid: [
      { name: 'Chapter Keeper', emoji: '🧛', hp: 90 },
      { name: 'Syntax Wyrm',   emoji: '🐉', hp: 100 },
      { name: 'Plot Hole',     emoji: '👾', hp: 85 },
    ],
    boss: [
      { name: "Writer's Block", emoji: '💀', hp: 180 },
      { name: 'The Blank Page', emoji: '📄', hp: 200 },
      { name: 'The Critic',     emoji: '👑', hp: 220 },
    ]
  };

  const quests = [
    { name: 'The Dusty Shelf',   waves: ['minion','minion','minion'] },
    { name: 'Ink-Stained Halls', waves: ['minion','minion','mid'] },
    { name: 'The Dark Stacks',   waves: ['minion','mid','mid'] },
    { name: 'Forgotten Chapter',   waves: ['mid','mid','boss'] },
    { name: 'The Final Draft',   waves: ['mid','boss','boss'] },
  ];

  const runeReward = { minion: 8, mid: 18, boss: 60 };
  const xpReward   = { minion: 15, mid: 35, boss: 80 };
  const relicNames = [
    'Quill of Echoes','Inkwell of Dusk','Tattered Bookmark','Gilded Ampersand',
    'Broken Serif','Moth-Eaten Scroll','Crystal Semicolon','Ember Pen Nib',
    'Rusted Clasp','Fossilized Eraser','Phantom Page','Moonlit Margin',
  ];

  // ── GAME STATE ──
  const S = {
    level: 1, xp: 0, xpToLevel: 100,
    runes: 0, streak: 0, goalReached: false,
    slain: 0, relics: 0, crits: 0,
    questIdx: 0, waveIdx: 0,
    monsterHp: 0, monsterMaxHp: 0,
    prevWords: 0, totalWords: 0,
    zen: false,
  };

  // ── DOM REFS ──
  const el = (id) => document.getElementById(id);
  const editor      = el('editor');
  const goalFill    = el('goalFill');
  const goalCount   = el('goalCount');
  const monsterSprite = el('monsterSprite');
  const damagePop   = el('damagePop');
  const hpFill      = el('hpFill');
  const combatLog   = el('combatLog');
  const rewardToast = el('rewardToast');

  // ── SPAWN ──
  function pickMonster(tier) {
    const pool = bestiary[tier];
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function spawnNext() {
    const quest = quests[S.questIdx];
    if (S.waveIdx >= quest.waves.length) {
      // Quest complete — advance
      S.questIdx = (S.questIdx + 1) % quests.length;
      S.waveIdx = 0;
      showToast('Quest complete! Next: ' + quests[S.questIdx].name);
    }
    const tier = quests[S.questIdx].waves[S.waveIdx];
    const mon = pickMonster(tier);
    S.monsterHp = mon.hp;
    S.monsterMaxHp = mon.hp;
    renderMonster(mon, tier);
    renderQuest();
  }

  function renderMonster(mon, tier) {
    monsterSprite.textContent = mon.emoji;
    monsterSprite.className = 'monster-sprite';
    el('monsterName').textContent = mon.name;
    el('monsterHp').textContent = mon.hp + ' / ' + mon.hp;
    const tierEl = el('monsterTier');
    tierEl.textContent = tier.charAt(0).toUpperCase() + tier.slice(1);
    tierEl.className = 'monster-tier tier-' + tier;
    hpFill.style.width = '100%';
    hpFill.className = 'hp-fill';
    combatLog.textContent = 'A new foe appears...';
    combatLog.className = 'combat-log';
  }

  function renderQuest() {
    const quest = quests[S.questIdx];
    el('questTag').textContent = 'QUEST ' + (S.questIdx + 1) + ' OF ' + quests.length;
    el('questName').textContent = quest.name;
    el('questProgress').textContent = S.waveIdx + ' / ' + quest.waves.length;
  }

  // ── COMBAT ──
  function dealDamage(isCrit) {
    if (S.monsterHp <= 0) return;
    const dmg = isCrit ? 12 : 4;
    S.monsterHp = Math.max(0, S.monsterHp - dmg);
    if (isCrit) S.crits++;

    // HP bar
    const pct = (S.monsterHp / S.monsterMaxHp) * 100;
    hpFill.style.width = pct + '%';
    hpFill.className = 'hp-fill' + (pct < 25 ? ' critical' : pct < 55 ? ' wounded' : '');
    el('monsterHp').textContent = S.monsterHp + ' / ' + S.monsterMaxHp;

    // Damage popup
    damagePop.textContent = '-' + dmg;
    damagePop.className = 'damage-pop' + (isCrit ? ' crit-pop' : '');
    void damagePop.offsetWidth;
    damagePop.classList.add('visible');

    // Monster anim
    monsterSprite.classList.remove('hit', 'crit', 'idle');
    void monsterSprite.offsetWidth;
    monsterSprite.classList.add(isCrit ? 'crit' : 'hit');

    // Log
    combatLog.textContent = isCrit ? 'Critical hit! -' + dmg : 'Hit! -' + dmg;
    combatLog.className = 'combat-log ' + (isCrit ? 'crit-msg' : 'active');

    // Kill?
    if (S.monsterHp <= 0) killMonster();

    renderStats();
  }

  function killMonster() {
    const tier = quests[S.questIdx].waves[S.waveIdx];
    const runes = runeReward[tier];
    const xp = xpReward[tier];
    S.slain++;
    S.runes += runes;
    addXP(xp);
    S.waveIdx++;

    // Relic drop (15% chance)
    const gotRelic = Math.random() < .15;
    if (gotRelic) S.relics++;

    monsterSprite.classList.remove('hit', 'crit');
    monsterSprite.classList.add('dying');
    combatLog.textContent = 'Defeated!';
    combatLog.className = 'combat-log kill-msg';

    let msg = '+' + runes + ' runes, +' + xp + ' XP';
    if (gotRelic) msg += '  —  Relic: ' + relicNames[Math.floor(Math.random() * relicNames.length)];
    showToast(msg);

    setTimeout(spawnNext, 1400);
  }

  function addXP(amount) {
    S.xp += amount;
    while (S.xp >= S.xpToLevel) {
      S.xp -= S.xpToLevel;
      S.level++;
      S.xpToLevel = Math.floor(S.xpToLevel * 1.3);
      showToast('Level up! You are now level ' + S.level, true);
    }
  }

  // ── RENDER ──
  function renderStats() {
    el('level').textContent = S.level;
    el('xpBar').style.width = (S.xp / S.xpToLevel * 100) + '%';
    el('runes').textContent = S.runes;
    el('streak').textContent = S.streak + (S.streak === 1 ? ' day' : ' days');
    el('totalWords').textContent = S.totalWords.toLocaleString() + ' words';
    el('slainCount').textContent = S.slain;
    el('relicCount').textContent = S.relics;
    el('critCount').textContent = S.crits;
  }

  function renderGoal() {
    const w = Math.min(S.totalWords, 300);
    goalFill.style.width = (w / 300 * 100) + '%';
    const gc = el('goalCount');
    gc.textContent = w + ' / 300';
    gc.className = 'goal-count' + (S.goalReached ? ' done' : '');
    if (S.totalWords >= 300 && !S.goalReached) {
      S.goalReached = true;
      S.streak = 1;
      showToast('Daily goal reached! Streak: 1 day', true);
      renderStats();
    }
  }

  // ── TOAST ──
  let toastTimer;
  function showToast(msg, isGoal) {
    rewardToast.textContent = msg;
    rewardToast.className = 'reward-toast visible' + (isGoal ? ' goal-toast' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { rewardToast.className = 'reward-toast'; }, 2800);
  }

  // ── EDITOR INPUT ──
  editor.addEventListener('input', () => {
    const text = editor.value;
    const words = text.trim().split(/\s+/).filter(w => w.length > 0);
    const wc = words.length;

    if (wc > S.prevWords) {
      S.totalWords += wc - S.prevWords;
      // Sentence check
      const tail = text.trimEnd().slice(-1);
      const isCrit = ['.','!','?'].includes(tail);
      if (!S.zen) dealDamage(isCrit);
      renderGoal();
      el('saveStatus').textContent = 'Saved';
    }
    S.prevWords = wc;
    renderStats();
  });

  // ── ZEN MODE ──
  el('zenBtn').addEventListener('click', () => {
    S.zen = !S.zen;
    el('arena').classList.toggle('zen', S.zen);
    el('zenBtn').classList.toggle('active', S.zen);
    el('zenBtn').textContent = S.zen ? 'Exit Zen' : 'Zen Mode';
  });

  // ── SESSION TIMER ──
  const t0 = Date.now();
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    const m = Math.floor(s / 60);
    el('sessionTime').textContent = m + ':' + String(s % 60).padStart(2, '0');
  }, 1000);

  // ── INIT ──
  spawnNext();
  renderStats();
  renderGoal();
})();
</script>
</body>
</html>
